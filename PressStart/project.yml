name: PressStart
options:
  bundleIdPrefix: com.nikolaikushner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  DeltaCore:
    path: ../Vendor/DeltaCore
targets:
  PressStart:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DesignSystem
      - path: Emulation
      - path: Library
      - path: Play
      - path: Supporting
      - path: Resources
        type: resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaikushner.pressstart
        INFOPLIST_KEY_CFBundleDisplayName: Press Start
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppleMusicUsageDescription: ""
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsDocumentBrowser: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_ENTITLEMENTS: Supporting/PressStart.entitlements
        OTHER_LDFLAGS: "$(inherited)"
    dependencies:
      - package: DeltaCore
        product: DeltaCore
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Press Start
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UTImportedTypeDeclarations: []
        CFBundleDocumentTypes:
          - CFBundleTypeName: ROM
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.item
        NSMicrophoneUsageDescription: Press Start does not record audio; this key satisfies controller frameworks.