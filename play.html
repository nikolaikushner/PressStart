<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Game</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="play">
  <div class="device">
    <div class="screen">
      <div class="lcd">
        <div id="game"></div>
        <button id="start" class="start-hit" type="button" hidden>Play</button>
      </div>
    </div>
    <div class="shell">
      <img id="shell" alt="" draggable="false">
      <div id="hits"></div>
    </div>
  </div>
  <div id="actions" class="sheet" hidden>
    <div class="sheet-card">
      <button id="back" type="button">Back</button>
      <button id="save" type="button">Save</button>
      <button id="load" type="button">Load</button>
      <button id="restart" type="button">Restart</button>
      <button id="actions-close" type="button">Close</button>
    </div>
  </div>
  <p id="toast" class="toast" hidden></p>
  <script type="module" src="js/player.js"></script>
</body>
</html>
