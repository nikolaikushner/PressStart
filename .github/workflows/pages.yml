name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect marketing site
        run: |
          mkdir -p _site/brand
          cp index.html favicon.svg .nojekyll manifest.webmanifest _site/
          cp brand/press-start-icon.png _site/brand/
          cp brand/press-start-logo.png _site/brand/ 2>/dev/null || true
          cp -R landing _site/landing
          cp landing/privacy.html _site/privacy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
